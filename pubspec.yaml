name: flutter_remote_dev
description: "A Flutter project with Remote OTA Patching via Cloudflare Worker and GitHub Actions CI/CD"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_patcher: ^0.1.4
  http: ^1.2.0
  crypto: ^3.0.3
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/version.json
